# maize_4m_pretrain_15k_d2: global batch 256 = 16 per GPU x 4 GPUs x 4 accumulation steps.
# Launch with torchrun --nproc_per_node=<world_size>; see README.md.
data:
  data_root: data/Maize
  img_size: 224
  num_points: 8192
  view_sampling: false
  view_seed: 42
  rgb_file: rgba.png
  param_schema: v2
model:
  active_modalities: pc,rgb,depth,text
  model_size: base
  mask_ratio: 0.8
  loss_name: qal_loss
  qal_threshold: 0.01
  qal_alpha: 100.0
  qal_use_squared: false
  pc_sinkhorn_weight: 0.5
  pc_sinkhorn_points: 1024
  pc_sinkhorn_blur: 0.02
  pc_loss_weight: 1.0
  depth_norm_type: minmax
  spline_loss_weight: 5.0
  max_leaves: 28
training:
  batch_size: 16
  accum_steps: 4
  epochs: 1000
  lr: 0.0006
  weight_decay: 0.05
  warmup_epochs: 20
  val_freq: 20
  test_freq: 0
checkpointing:
  output_dir: ./outputs/maize_4m_pretrain_15k_d2
  save_freq: 5
  keep_last: 3
  keep_every: 100
  resume: null
visualization:
  viz_freq: 20
  num_viz_samples: 12
distributed:
  world_size: 4
  dist_backend: nccl
  dist_url: env://
system:
  num_workers: 15
  device: cuda
wandb:
  use_wandb: false
  wandb_project: embodied-mae-maize
  wandb_entity: null
  wandb_name: maize_4m_pretrain_15k_d2
