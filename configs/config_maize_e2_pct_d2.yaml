# maize_e2_pct_d2: global batch 32 = 16 per GPU x 2 GPUs.
# Launch with torchrun --nproc_per_node=<world_size>; see README.md.
data:
  data_root: data/Maize
  rgb_file: rgba.png
  param_schema: v2
  img_size: 224
  num_points: 8192
  view_sampling: true
  view_seed: 42
model:
  active_modalities: pc,text
  model_size: base
  mask_ratio: 0.8
  loss_name: qal_loss
  qal_threshold: 0.01
  qal_alpha: 100.0
  qal_use_squared: false
  pc_loss_weight: 1.0
  depth_norm_type: minmax
  spline_loss_weight: 5.0
  max_leaves: 28
training:
  batch_size: 16
  epochs: 600
  lr: 0.00015
  weight_decay: 0.05
  warmup_epochs: 40
  val_freq: 25
  test_freq: 0
checkpointing:
  output_dir: ./outputs/maize_e2_pct_d2
  save_freq: 25
  resume: null
visualization:
  viz_freq: 25
  num_viz_samples: 6
distributed:
  world_size: 2
  dist_backend: nccl
  dist_url: env://
system:
  num_workers: 14
  device: cuda
wandb:
  use_wandb: false
  wandb_project: embodied-mae-maize
  wandb_entity: null
  wandb_name: maize_e2_pct_d2
