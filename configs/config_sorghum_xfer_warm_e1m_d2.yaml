# sorghum_xfer_warm_e1m_d2: global batch 32 = 16 per GPU x 2 GPUs.
# Launch with torchrun --nproc_per_node=<world_size>; see README.md.
data:
  data_root: data/Sorghum_15K
  rgb_file: rgb_nobg.png
  img_size: 224
  num_points: 8196
  view_sampling: true
  view_seed: 42
model:
  active_modalities: pc,rgb,depth
  model_size: base
  mask_ratio: 0.8
  loss_name: qal_loss
  qal_threshold: 0.01
  qal_alpha: 100.0
  qal_use_squared: false
  pc_loss_weight: 1.0
  depth_norm_type: minmax
  spline_loss_weight: 5.0
  max_leaves: 24
training:
  batch_size: 16
  epochs: 150
  lr: 0.00015
  weight_decay: 0.05
  warmup_epochs: 10
  val_freq: 10
  test_freq: 0
checkpointing:
  output_dir: outputs/sorghum_xfer_warm_e1m_d2
  save_freq: 25
  resume: null
  keep_last: 3
  keep_every: 50
visualization:
  viz_freq: 0
  num_viz_samples: 6
distributed:
  world_size: 2
  dist_backend: nccl
  dist_url: env://
system:
  num_workers: 14
  device: cuda
wandb:
  use_wandb: false
  wandb_project: embodied-mae-sorghum
  wandb_entity: null
  wandb_name: sorghum_xfer_warm_e1m_d2
init:
  checkpoint: ./outputs/maize_4m_pretrain_15k_d2/checkpoints/checkpoint_epoch_1000.pth
