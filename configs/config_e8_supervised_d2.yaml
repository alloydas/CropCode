# e8_supervised_d2: global batch 32 = 16 per GPU x 2 GPUs.
# Launch with torchrun --nproc_per_node=<world_size>; see README.md.
entry_point: train_supervised_4m.py
data:
  data_root: data/Sorghum_15K
  rgb_file: rgb_nobg.png
  img_size: 224
  num_points: 8196
  view_sampling: true
  view_seed: 42
  max_plants: null
model:
  model_size: base
  active_modalities: pc,rgb,depth
  loss_name: qal_loss
  qal_threshold: 0.01
  qal_alpha: 100.0
  qal_use_squared: false
  pc_loss_weight: 1.0
  depth_norm_type: minmax
  spline_loss_weight: 5.0
  max_leaves: 24
  text_mask_ratio: 'E8 supervised config: launch train_supervised_4m.py, never train_sorghum_4m.py'
  mask_ratio: null
training:
  batch_size: 16
  epochs: 600
  lr: 0.00015
  weight_decay: 0.05
  warmup_epochs: 40
  val_freq: 25
  test_freq: 0
checkpointing:
  output_dir: ./outputs/e8_supervised_d2
  save_freq: 25
  resume: null
distributed:
  world_size: 2
  dist_backend: nccl
  dist_url: env://
system:
  num_workers: 14
  device: cuda
wandb:
  use_wandb: false
  wandb_project: embodied-mae-sorghum
  wandb_entity: null
  wandb_name: e8_supervised_d2
