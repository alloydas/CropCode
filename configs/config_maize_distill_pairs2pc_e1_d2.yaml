# maize_distill_pairs2pc_e1_d2: global batch 128 = 16 per GPU x 2 GPUs x 4 accumulation steps.
# Launch with torchrun --nproc_per_node=<world_size>; see README.md.
data:
  data_root: data/Maize
  img_size: 224
  num_points: 8192
  max_plants: null
  rgb_file: rgba.png
  param_schema: v2
model:
  active_modalities: pc,rgb,depth,text
  model_size: base
  mask_ratio: 0.8
  loss_name: qal_loss
  qal_threshold: 0.01
  qal_alpha: 100.0
  qal_use_squared: false
  pc_sinkhorn_weight: 0.5
  pc_sinkhorn_points: 1024
  pc_sinkhorn_blur: 0.02
  pc_loss_weight: 1.0
  depth_norm_type: minmax
  spline_loss_weight: 5.0
  max_leaves: 28
distill:
  teacher_checkpoint: ./outputs/maize_4m_pretrain_15k_d2/checkpoints/checkpoint_epoch_1000.pth
  student_init: ./outputs/maize_4m_pretrain_15k_d2/checkpoints/checkpoint_epoch_1000.pth
  expect_init_epoch: 1000
  crossmodal_prob: 0.8
  sources:
  - rgb+depth
  - rgb+text
  - depth+text
  target:
  - pc
  feat_distill_weight: 1.0
  cls_distill_weight: 0.5
  output_distill_weight: 0.0
  distill_masked_only: true
  source_mask_ratio: 0.0
  viz_source: rgb+depth
  teacher_visible:
  - rgb
  - depth
  - pc
  - text
  teacher_source_mask_ratio: 0.5
  allow_all_visible_teacher: false
training:
  batch_size: 16
  accum_steps: 4
  global_batch: 128
  epochs: 100
  lr: 3.0e-05
  weight_decay: 0.05
  warmup_epochs: 5
  val_freq: 5
  val_max_batches: 100
  val_at_start: true
  eval_seed: 0
checkpointing:
  output_dir: ./outputs/maize_distill_pairs2pc_e1_d2
  save_freq: 2
  keep_last: 2
  resume: null
visualization:
  viz_freq: 10
  num_viz_samples: 6
distributed:
  world_size: 2
  dist_backend: nccl
  dist_url: env://
  timeout_min: 60
system:
  num_workers: 16
  device: cuda
wandb:
  use_wandb: false
  wandb_project: embodied-mae-maize
  wandb_entity: null
  wandb_name: maize_distill_pairs2pc_e1_d2_100ep
